name: ${PROJECT_NAME:-monokit}

x-database-url: &database-url postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}

x-node: &node
  build: { context: ., dockerfile: ./docker/development/Dockerfile.dev }
  image: ${COMPOSE_PROJECT_NAME}-base
  volumes:
    - .:/repo
    - api_node_modules:/repo/apps/api/node_modules
    - web_node_modules:/repo/apps/web/node_modules
    - db_node_modules:/repo/packages/db/node_modules
    - nest_node_modules:/repo/packages/nest/node_modules
    - contracts_node_modules:/repo/packages/contracts/node_modules
    - geo_node_modules:/repo/packages/geo/node_modules
    - ui_node_modules:/repo/packages/ui/node_modules
    - pnpm_store:/pnpm/store

